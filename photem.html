  /* ── Build gallery (reversed order) ── */
  const gallery = document.getElementById('gallery');
  [...PHOTOS].reverse().forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'photem-item';
    item.style.transitionDelay = (i % 6) * 0.06 + 's';
    item.innerHTML = `
      <img src="${p.src}" alt="${p.title}" loading="lazy">
      <div class="photem-item-cap"><span class="photem-item-title">${p.title}</span></div>
    `;
    item.addEventListener('click', () => openLightbox(p));
    gallery.appendChild(item);
  });

  /* ── Reveal on scroll ── */
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.photem-item').forEach(el => io.observe(el));

  /* ── Lightbox ── */
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightboxImg');

  function openLightbox(p) {
    lbImg.src = p.src;
    lbImg.alt = p.title;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
